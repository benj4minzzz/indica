<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inertia — Licenses</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="slides.css">
  <style>
    /* dashboard: the landing page's look (slides.css), one screen, the
       licence list scrolls inside it if there are many */
    .dash {
      position: fixed; inset: var(--nav-h) 0 var(--foot-h) 0; z-index: 1;
      overflow-y: auto; padding: clamp(16px, 5vh, 48px) clamp(16px, 5vw, 72px);
    }
    .dash .inner { width: min(1180px, 100%); margin: 0 auto; }
    .dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .dash-head .kicker { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    .dash-head h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3vw, 40px); line-height: 1.1; margin-top: 6px; }
    .dash-head p { color: var(--text-dim); margin-top: 6px; }
    .btn.soft { background: var(--accent-soft); border-color: rgba(110, 115, 251, 0.35); color: #c9cbff; }
    .btn.soft:hover { background: rgba(110, 115, 251, 0.22); }
    .btn:disabled { opacity: .45; cursor: default; }
    #orders-list { display: grid; gap: 14px; }
    .license {
      display: grid; grid-template-columns: 1fr 1fr auto; gap: 18px 28px; align-items: start;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px;
      animation: pop .5s var(--ease) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .license .group + .group { margin-top: 12px; }
    .license .label { font-size: 12px; color: var(--text-mute); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .license .value { margin-top: 2px; color: var(--text); }
    .license .value strong { font-weight: 700; }
    .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.ok { color: #7ee0a0; }
    .status.warn { color: #f08a8a; }
    .keypill {
      margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 6px 12px;
    }
    .keypill code { font: 500 13px "JetBrains Mono", ui-monospace, monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .keypill button { border: 0; background: transparent; color: var(--text-dim); cursor: pointer; display: grid; place-items: center; padding: 4px; border-radius: 6px; }
    .keypill button:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .actions { display: grid; gap: 8px; min-width: 170px; }
    .note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; color: var(--text-dim); }
    .note a { color: var(--accent); }

    /* sign-in card over a blurred page */
    .overlay {
      position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
      background: rgba(6, 6, 6, 0.72); backdrop-filter: blur(10px);
    }
    .overlay.hidden { display: none; }
    .auth {
      position: relative; width: min(400px, 100%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9), 0 0 100px -40px rgba(110, 115, 251, 0.5);
      animation: pop .45s var(--ease) both;
    }
    .auth h2 { font-family: var(--display); font-weight: 700; font-size: 24px; }
    .auth p { color: var(--text-dim); font-size: 14px; margin: 6px 0 18px; }
    .auth label { display: block; font-size: 12px; font-weight: 600; color: var(--text-mute); letter-spacing: .04em; text-transform: uppercase; margin: 12px 0 6px; }
    .auth input {
      width: 100%; height: 42px; padding: 0 12px; border-radius: 8px;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font: 500 14px var(--body);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .auth input:focus { border-color: rgba(110, 115, 251, 0.6); box-shadow: 0 0 0 3px rgba(110, 115, 251, 0.15); }
    .auth .btn.primary { width: 100%; margin-top: 20px; height: 42px; }
    .auth .close {
      position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 8px;
      border: 0; background: transparent; color: var(--text-dim); font-size: 20px; cursor: pointer;
    }
    .auth .close:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .auth .close:disabled { display: none; }
    .err { display: none; margin-top: 12px; color: #f08a8a; font-size: 13px; }

    @media (max-width: 760px) {
      .license { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr 1fr; min-width: 0; }
      .dash-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="glow"></div>

<header class="nav">
  <a class="logo" href="index.html" aria-label="inertia"><img src="logo.png" alt="inertia"></a>
  <nav class="nav-links">
    <a class="hide-sm" href="index.html#features">Features</a>
    <a class="hide-sm" href="index.html#pricing">Pricing</a>
    <a href="https://discord.gg/2WXNQyR8nq" target="_blank" rel="noopener">Discord</a>
    <button class="btn" id="logoutBtn" type="button">Log out</button>
  </nav>
</header>

<main class="dash">
  <div class="inner">
    <div class="dash-head">
      <div>
        <span class="kicker">Dashboard</span>
        <h1>Your licenses</h1>
        <p>Your keys, how long they have left, and HWID resets.</p>
      </div>
      <button class="btn soft" type="button" onclick="showAuth(true)">Add a key</button>
    </div>
    <div id="orders-list"></div>
  </div>
</main>

<div class="overlay hidden" id="auth-overlay">
  <div class="auth">
    <button class="close" id="auth-close-btn" type="button" aria-label="Close">&times;</button>
    <h2>Sign in</h2>
    <p>Use the license key and password you got with your purchase.</p>
    <label for="input-key">License key</label>
    <input id="input-key" autocomplete="username" spellcheck="false">
    <label for="input-pwd">Password</label>
    <input id="input-pwd" type="password" autocomplete="current-password">
    <button class="btn primary" id="signin-btn" type="button">Sign in</button>
    <div class="err" id="login-error"></div>
  </div>
</div>

<footer class="footer">
  <span>&copy; 2026 inertia &middot; Not affiliated with Ubisoft. &middot; Icons by <a href="https://icons8.com" target="_blank" rel="noopener">Icons8</a></span>
  <nav>
    <a href="index.html">Home</a>
    <a href="https://discord.gg/2WXNQyR8nq" target="_blank" rel="noopener">Support</a>
  </nav>
</footer>

<script>
"use strict";
// Same Supabase project as before. The anon key is public by design: both
// RPCs check the key + password on the server (see supabase-dashboard.sql)
// and never hand the password column to the browser.
const SUPABASE_URL = "https://mafafvjxkhtbyacpnswa.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hZmFmdmp4a2h0YnlhY3Buc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NTMzMDQsImV4cCI6MjA5MTUyOTMwNH0.t-SU36Q2uNnOOPv6M0VjSJ6AH_jh_nkkTtC8K8v8OKY";
// Kept the same name as the old site so keys people already saved still load.
const LS_KEY = "indica_saved_keys";
const DISCORD = "https://discord.gg/2WXNQyR8nq";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let savedKeys = [];  // [{ key, pwd }]
let licenses = [];   // [{ license_key, pwd, is_active, expires_at, duration_days, hwid_bound, hwid_hint }]

window.addEventListener("DOMContentLoaded", () => {
  try {
    const stored = localStorage.getItem(LS_KEY);
    if (stored) savedKeys = JSON.parse(stored) || [];
  } catch (e) { savedKeys = []; }
  if (savedKeys.length) loadAllSavedKeys(); else showAuth(false);
});

function showAuth(closable) {
  document.getElementById("auth-overlay").classList.remove("hidden");
  document.getElementById("auth-close-btn").disabled = !closable;
  document.getElementById("input-key").value = "";
  document.getElementById("input-pwd").value = "";
  document.getElementById("login-error").style.display = "none";
  setTimeout(() => document.getElementById("input-key").focus(), 0);
}
function closeAuth() { document.getElementById("auth-overlay").classList.add("hidden"); }

async function fetchLicense(key, pwd) {
  const { data, error } = await sb.rpc("dashboard_license", { p_key: key, p_password: pwd });
  if (error) throw error;
  return data; // null when the key/password pair doesn't match
}

async function loadAllSavedKeys() {
  if (!savedKeys.length) { showAuth(false); return; }
  try {
    const results = await Promise.all(savedKeys.map(async (sk) => {
      try {
        const data = await fetchLicense(sk.key, sk.pwd);
        return data ? { ...data, pwd: sk.pwd } : null;
      } catch (e) { return null; }
    }));
    licenses = results.filter(Boolean);
    if (licenses.length) { persistSavedKeys(); closeAuth(); renderOrders(); }
    else logout();
  } catch (err) {
    console.error(err);
    showAuth(savedKeys.length > 0);
  }
}

function persistSavedKeys() {
  savedKeys = licenses.map(l => ({ key: l.license_key, pwd: l.pwd }));
  try { localStorage.setItem(LS_KEY, JSON.stringify(savedKeys)); } catch (e) {}
}

async function attemptAuth() {
  const errEl = document.getElementById("login-error");
  const btn = document.getElementById("signin-btn");
  const licenseKey = document.getElementById("input-key").value.trim();
  const password = document.getElementById("input-pwd").value;
  errEl.style.display = "none";
  if (!licenseKey || !password) return;
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    const data = await fetchLicense(licenseKey, password);
    if (!data) {
      errEl.textContent = "Wrong license key or password.";
      errEl.style.display = "block";
      return;
    }
    if (!licenses.some(l => l.license_key === data.license_key)) licenses.push({ ...data, pwd: password });
    persistSavedKeys();
    closeAuth();
    renderOrders();
  } catch (err) {
    errEl.textContent = err.message || "Something went wrong. Try again.";
    errEl.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

function renderOrders() {
  const container = document.getElementById("orders-list");
  container.innerHTML = "";
  if (!licenses.length) {
    container.innerHTML = '<div class="note">No licenses yet. <a href="index.html#pricing">Get one</a> or <a href="#" onclick="showAuth(true);return false;">add an existing key</a>.</div>';
    return;
  }
  const copySvg = '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  licenses.forEach((lic, idx) => {
    const expDate = lic.expires_at ? new Date(lic.expires_at) : null;
    const expStr = expDate ? expDate.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) : "Never";
    const isExpired = expDate && expDate <= new Date();
    const isActive = lic.is_active && !isExpired;
    const status = !lic.is_active ? "Disabled" : isExpired ? "Expired" : "Active";
    const duration = lic.duration_days ? getDurationLabel(lic.duration_days) : "Lifetime";
    const rowId = "key-" + idx;

    const card = document.createElement("div");
    card.className = "license";
    card.innerHTML = `
      <div>
        <div class="group"><div class="label">Plan</div><div class="value"><strong>inertia</strong> &middot; ${escapeHtml(duration)}</div></div>
        <div class="group"><div class="label">Status</div><div class="value"><span class="status ${isActive ? "ok" : "warn"}">${status}</span></div></div>
        <div class="group"><div class="label">Key</div>
          <div class="keypill"><code>${escapeHtml(lic.license_key)}</code><button data-copy="${escapeHtml(lic.license_key)}" title="Copy key">${copySvg}</button></div>
        </div>
      </div>
      <div>
        <div class="group"><div class="label">Time left</div><div class="value"><strong>${getTimeLeft(lic.expires_at)}</strong></div></div>
        <div class="group"><div class="label">Expires</div><div class="value">${expStr}</div></div>
        <div class="group"><div class="label">HWID</div><div class="value">${lic.hwid_bound ? escapeHtml(lic.hwid_hint || "Bound") : "Not bound"}</div></div>
      </div>
      <div class="actions">
        <a class="btn soft" href="index.html#pricing">Buy more time</a>
        ${lic.hwid_bound
          ? `<button class="btn" id="rst-${rowId}" data-reset="${escapeHtml(lic.license_key)}" data-pwd="${escapeHtml(lic.pwd)}">Reset HWID</button>`
          : `<button class="btn" disabled>Reset HWID</button>`}
        <a class="btn" href="${DISCORD}" target="_blank" rel="noopener">Support</a>
        <button class="btn" data-remove="${escapeHtml(lic.license_key)}">Remove</button>
      </div>`;
    container.appendChild(card);
  });
}

function getDurationLabel(days) {
  if (!days) return "Lifetime";
  if (days <= 1) return "1 Day";
  if (days <= 7) return "1 Week";
  if (days <= 31) return "1 Month";
  return Math.ceil(days / 30) + " Months";
}
function getTimeLeft(expiryString) {
  if (!expiryString) return "Lifetime";
  const diffMs = new Date(expiryString) - new Date();
  if (diffMs <= 0) return "Expired";
  const d = Math.floor(diffMs / 86400000);
  const h = Math.floor((diffMs % 86400000) / 3600000);
  const m = Math.floor((diffMs % 3600000) / 60000);
  const parts = [];
  if (d > 0) parts.push(d + "d");
  if (h > 0) parts.push(h + "h");
  if (m > 0) parts.push(m + "m");
  return (parts.join(" ") || "0m") + " left";
}
function escapeHtml(v) { return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); } catch (e) {} }

function removeLicense(licenseKey) {
  licenses = licenses.filter(l => l.license_key !== licenseKey);
  persistSavedKeys();
  if (licenses.length) renderOrders(); else logout();
}

async function unbindHWID(licenseKey, password, rowId) {
  const btn = document.getElementById("rst-" + rowId);
  if (!btn) return;
  btn.disabled = true; btn.textContent = "Releasing...";
  try {
    const { data, error } = await sb.rpc("dashboard_reset_hwid", { p_key: licenseKey, p_password: password });
    if (error) throw error;
    if (!data) { alert("Reset failed. Check the key and password."); return; }
    const fresh = await fetchLicense(licenseKey, password);
    if (fresh) {
      const i = licenses.findIndex(l => l.license_key === licenseKey);
      if (i >= 0) licenses[i] = { ...fresh, pwd: password };
    }
    renderOrders();
  } catch (err) {
    alert("Failed: " + (err.message || "unknown error"));
  } finally {
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = "Reset HWID"; }
  }
}

function logout() {
  savedKeys = []; licenses = [];
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  document.getElementById("orders-list").innerHTML = "";
  showAuth(false);
}

document.getElementById("orders-list").addEventListener("click", (e) => {
  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) { copyText(copyBtn.getAttribute("data-copy")); return; }
  const removeBtn = e.target.closest("[data-remove]");
  if (removeBtn) { removeLicense(removeBtn.getAttribute("data-remove")); return; }
  const resetBtn = e.target.closest("[data-reset]");
  if (resetBtn) unbindHWID(resetBtn.getAttribute("data-reset"), resetBtn.getAttribute("data-pwd"), resetBtn.id.replace(/^rst-/, ""));
});
document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("auth-close-btn").addEventListener("click", () => { if (licenses.length) closeAuth(); });
document.getElementById("signin-btn").addEventListener("click", attemptAuth);
document.getElementById("input-pwd").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptAuth(); });
document.getElementById("input-key").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptAuth(); });
window.showAuth = showAuth;
</script>
</body>
</html>
