<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>indica.gg — My Licenses</title>
<meta name="description" content="Manage your indica.gg license: check time remaining and reset your device lock.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh}
  .dash-top{
    position:sticky;top:0;z-index:50;
    background:rgba(9,9,9,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .dash-top-inner{width:min(1080px,92%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px}
  .dash-main{width:min(1080px,92%);margin:0 auto;padding:48px 0 100px}
  .dash-head{margin-bottom:28px}
  .dash-head h1{font:800 2rem var(--display);letter-spacing:-.02em;margin:0}
  .dash-head p{color:var(--text-dim);font-size:.95rem;margin:6px 0 0}

  .orders{display:flex;flex-direction:column;gap:14px}
  .order-card{display:flex;gap:24px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 26px;transition:border-color .2s}
  .order-card:hover{border-color:rgba(var(--accent-rgb),.45)}
  .order-thumb{width:56px;border-radius:10px;flex-shrink:0;background:linear-gradient(160deg,rgba(var(--accent-rgb),.25),rgba(var(--accent-rgb),.05));border:1px solid rgba(var(--accent-rgb),.25);display:flex;align-items:center;justify-content:center;font:800 13px var(--display);color:var(--accent)}
  .order-col{min-width:0}
  .order-col.product{flex:1.3}
  .order-col.meta{flex:1}
  .order-col.links{flex:0 0 150px;display:flex;flex-direction:column}
  .order-label{font:600 9px var(--mono);color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
  .order-value{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .order-tag{font:600 9px var(--mono);padding:2px 8px;border-radius:5px;background:rgba(var(--accent-rgb),.12);color:var(--accent)}
  .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .status-dot.green{background:#4cc38a;box-shadow:0 0 8px rgba(76,195,138,.5)}
  .status-dot.amber{background:#666;box-shadow:0 0 6px rgba(255,255,255,.15)}
  .status-text{font-size:12.5px;font-weight:700}
  .status-text.green{color:#4cc38a}
  .status-text.amber{color:#888}
  .key-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:6px 12px;max-width:100%}
  .key-pill code{font:11.5px var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .key-pill button{color:var(--text-dim);background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:2px;transition:color .15s}
  .key-pill button:hover{color:var(--text)}
  .meta-line{font:11.5px var(--mono);color:var(--text-row);word-break:break-all}
  .meta-sub{font-size:12px;color:var(--text-dim)}
  .link-stack{display:flex;flex-direction:column;gap:6px;margin-top:auto}
  .link-btn{display:flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:8px;background:rgba(var(--accent-rgb),.1);border:1px solid rgba(var(--accent-rgb),.2);font-size:11.5px;font-weight:700;color:var(--accent);transition:all .15s;cursor:pointer;font-family:var(--display)}
  .link-btn:hover{background:rgba(var(--accent-rgb),.2);border-color:rgba(var(--accent-rgb),.4)}
  .link-btn:disabled{opacity:.35;cursor:not-allowed}
  .link-btn.neutral{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.07);color:var(--text-dim)}
  .link-btn.neutral:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .remove-btn{margin-top:10px;font-size:10px;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:0;text-align:left}
  .remove-btn:hover{color:var(--text)}
  .add-card{border:1px dashed var(--border);border-radius:16px;padding:36px;text-align:center;color:var(--text-dim);font-size:.92rem}
  .add-card a{color:var(--accent);font-weight:700}
  .empty-note{text-align:center;color:var(--text-dim);font-size:13px;padding:40px}
  .empty-note a{color:var(--accent);font-weight:700}

  /* auth overlay */
  .auth-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(5,5,5,.8);backdrop-filter:blur(10px)}
  .auth-overlay.hidden{display:none}
  .auth-card{width:440px;max-width:92%;padding:42px 38px;border-radius:18px;background:var(--card);border:1px solid var(--border);box-shadow:0 0 60px rgba(var(--accent-rgb),.12);position:relative}
  .auth-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .auth-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .auth-close:disabled{opacity:.3;cursor:not-allowed}
  .auth-title{text-align:center;font:800 26px var(--display);letter-spacing:-.02em;margin-bottom:6px}
  .auth-title em{font-style:normal;color:var(--accent)}
  .auth-sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin-bottom:26px}
  .error-msg{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.18);color:#fca5a5;padding:10px 14px;border-radius:9px;font-size:11.5px;text-align:center;display:none;margin-bottom:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:7px}
  .field input{width:100%;background:var(--page);border:1px solid var(--border);border-radius:10px;padding:13px 15px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;font-family:var(--ui)}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
  .btn-fill{width:100%;height:46px;border-radius:999px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;font-family:var(--display);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:.2s}
  .btn-fill:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn-fill:disabled{opacity:.6;cursor:not-allowed;transform:none}

  @media(max-width:820px){
    .order-card{flex-direction:column;gap:16px}
    .order-col.links{flex:auto}
    .link-stack{flex-direction:row;flex-wrap:wrap}
    .link-btn{flex:1}
  }
</style>
</head>
<body>

<div class="dash-top">
  <div class="dash-top-inner">
    <a class="brand" href="index.html">indica<b>.gg</b></a>
    <button class="btn dark small" id="logoutBtn">Sign out</button>
  </div>
</div>

<main class="dash-main">
  <div class="dash-head">
    <h1>My licenses</h1>
    <p>Every key saved on this device, with HWID status and time remaining.</p>
  </div>
  <div class="orders" id="orders-list"></div>
</main>

<div class="auth-overlay hidden" id="auth-overlay">
  <div class="auth-card">
    <button class="auth-close" id="auth-close-btn" aria-label="Close">×</button>
    <div class="auth-title">Welcome <em>back</em></div>
    <div class="auth-sub">Enter your license key to open your dashboard</div>
    <div id="login-error" class="error-msg"></div>
    <div class="field">
      <label for="input-key">License key</label>
      <input type="text" id="input-key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off">
    </div>
    <div class="field">
      <label for="input-pwd">Password</label>
      <input type="password" id="input-pwd" placeholder="••••••••">
    </div>
    <button class="btn-fill" id="signin-btn">Sign in</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
// Same Supabase project as licence/dashboard/app.js. The anon key is public by
// design here: both RPCs check the key + password on the server (see
// supabase-dashboard.sql) and never hand the password column to the browser.
const SUPABASE_URL = "https://mafafvjxkhtbyacpnswa.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hZmFmdmp4a2h0YnlhY3Buc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NTMzMDQsImV4cCI6MjA5MTUyOTMwNH0.t-SU36Q2uNnOOPv6M0VjSJ6AH_jh_nkkTtC8K8v8OKY";
const LS_KEY = "indica_saved_keys";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let savedKeys = [];  // [{ key, pwd }]
let licenses = [];   // [{ key, pwd, license_key, is_active, expires_at, duration_days, hwid_bound, hwid_hint }]

window.addEventListener("DOMContentLoaded", () => {
  try {
    const stored = localStorage.getItem(LS_KEY);
    if (stored) savedKeys = JSON.parse(stored) || [];
  } catch (e) { savedKeys = []; }
  if (savedKeys.length) loadAllSavedKeys(); else showAuth();
});

function showAuth(closable) {
  document.getElementById("auth-overlay").classList.remove("hidden");
  document.getElementById("auth-close-btn").disabled = !closable;
  document.getElementById("input-key").value = "";
  document.getElementById("input-pwd").value = "";
  document.getElementById("login-error").style.display = "none";
}
function closeAuth() { document.getElementById("auth-overlay").classList.add("hidden"); }

async function fetchLicense(key, pwd) {
  const { data, error } = await sb.rpc("dashboard_license", { p_key: key, p_password: pwd });
  if (error) throw error;
  return data; // null when the key/password pair doesn't match
}

async function loadAllSavedKeys() {
  if (!savedKeys.length) { showAuth(false); return; }
  try {
    const results = await Promise.all(savedKeys.map(async (sk) => {
      try {
        const data = await fetchLicense(sk.key, sk.pwd);
        return data ? { ...data, pwd: sk.pwd } : null;
      } catch (e) { return null; }
    }));
    licenses = results.filter(Boolean);
    if (licenses.length) {
      persistSavedKeys();
      closeAuth();
      renderOrders();
    } else {
      logout();
    }
  } catch (err) {
    console.error(err);
    showAuth(savedKeys.length > 0);
  }
}

function persistSavedKeys() {
  savedKeys = licenses.map(l => ({ key: l.license_key, pwd: l.pwd }));
  localStorage.setItem(LS_KEY, JSON.stringify(savedKeys));
}

async function attemptAuth() {
  const errEl = document.getElementById("login-error");
  const btn = document.getElementById("signin-btn");
  const licenseKey = document.getElementById("input-key").value.trim();
  const password = document.getElementById("input-pwd").value;
  errEl.style.display = "none";
  if (!licenseKey || !password) return;
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    const data = await fetchLicense(licenseKey, password);
    if (!data) {
      errEl.textContent = "Wrong license key or password.";
      errEl.style.display = "block";
      return;
    }
    if (!licenses.some(l => l.license_key === data.license_key)) {
      licenses.push({ ...data, pwd: password });
    }
    persistSavedKeys();
    closeAuth();
    renderOrders();
  } catch (err) {
    errEl.textContent = err.message || "Something went wrong. Try again.";
    errEl.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

function renderOrders() {
  const container = document.getElementById("orders-list");
  container.innerHTML = "";
  if (!licenses.length) {
    container.innerHTML = '<div class="empty-note">No licenses found. <a href="index.html#pricing">Buy one here</a> or <a href="#" onclick="showAuth(true);return false;">add an existing key</a>.</div>';
    return;
  }
  const copySvg = '<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  licenses.forEach((lic, idx) => {
    const expDate = lic.expires_at ? new Date(lic.expires_at) : null;
    const expStr = expDate ? expDate.toLocaleString("en-US", { dateStyle: "short", timeStyle: "short" }) : "Lifetime";
    const timeLeft = getTimeLeft(lic.expires_at);
    const isExpired = expDate && expDate <= new Date();
    const isActive = lic.is_active && !isExpired;
    const status = !lic.is_active ? "Disabled" : isExpired ? "Expired" : "Active";
    const statusColor = isActive ? "green" : "amber";
    const duration = lic.duration_days ? getDurationLabel(lic.duration_days) : "Lifetime";
    const rowId = "key-" + idx;

    const card = document.createElement("div");
    card.className = "order-card";
    card.innerHTML = `
      <div class="order-thumb">in</div>
      <div class="order-col product">
        <div class="order-label">Product</div>
        <div class="order-value">
          <strong>indica.gg</strong>
          <span class="order-tags"><span class="order-tag">${escapeHtml(duration)}</span></span>
        </div>
        <div style="margin-top:10px;">
          <div class="order-label">Status</div>
          <div class="order-value">
            <span class="status-dot ${statusColor}"></span>
            <span class="status-text ${statusColor}">${status}</span>
          </div>
        </div>
        <div style="margin-top:10px;">
          <div class="order-label">Key</div>
          <div class="key-pill">
            <code>${escapeHtml(lic.license_key)}</code>
            <button data-copy="${escapeHtml(lic.license_key)}" title="Copy">${copySvg}</button>
          </div>
        </div>
      </div>
      <div class="order-col meta">
        <div class="order-label">HWID</div>
        <div class="meta-line">${lic.hwid_bound ? escapeHtml(lic.hwid_hint || "Bound") : "Not bound"}</div>
        <div style="margin-top:10px;">
          <div class="order-label">Date</div>
          <div class="meta-sub">${expStr}</div>
        </div>
        <div style="margin-top:10px;">
          <div class="order-label">Time left</div>
          <div class="meta-sub" style="font-weight:700;color:${timeLeft === 'Expired' ? '#888' : 'var(--text)'};">${timeLeft}</div>
        </div>
        <button class="remove-btn" data-remove="${escapeHtml(lic.license_key)}">Remove</button>
      </div>
      <div class="order-col links">
        <div class="order-label" style="margin-bottom:6px;">Links</div>
        <div class="link-stack">
          <a href="index.html#pricing" class="link-btn">Buy more</a>
          ${lic.hwid_bound
            ? `<button id="rst-${rowId}" data-reset="${escapeHtml(lic.license_key)}" data-pwd="${escapeHtml(lic.pwd)}" class="link-btn">Reset HWID</button>`
            : `<button class="link-btn" disabled>Reset HWID</button>`}
          <a href="https://discord.gg/2WXNQyR8nq" target="_blank" class="link-btn neutral">Support</a>
        </div>
      </div>`;
    container.appendChild(card);
  });

  const add = document.createElement("div");
  add.className = "add-card";
  add.innerHTML = `Another key? <a href="#" onclick="showAuth(true);return false;">Sign in with it</a> — it'll be added to this dashboard.`;
  container.appendChild(add);
}

function getDurationLabel(days) {
  if (!days) return "Lifetime";
  if (days <= 1) return "1 Day";
  if (days <= 7) return "1 Week";
  if (days <= 31) return "1 Month";
  return Math.ceil(days / 30) + " Months";
}
function getTimeLeft(expiryString) {
  if (!expiryString) return "Lifetime";
  const diffMs = new Date(expiryString) - new Date();
  if (diffMs <= 0) return "Expired";
  const d = Math.floor(diffMs / 86400000);
  const h = Math.floor((diffMs % 86400000) / 3600000);
  const m = Math.floor((diffMs % 3600000) / 60000);
  let parts = [];
  if (d > 0) parts.push(d + "d");
  if (h > 0) parts.push(h + "h");
  if (m > 0) parts.push(m + "m");
  return (parts.join(" ") || "0m") + " left";
}
function escapeHtml(v) { return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); } catch (e) {} }

async function removeLicense(licenseKey) {
  licenses = licenses.filter(l => l.license_key !== licenseKey);
  persistSavedKeys();
  if (licenses.length) renderOrders(); else logout();
}

async function unbindHWID(licenseKey, password, rowId) {
  const btn = document.getElementById("rst-" + rowId);
  if (!btn) return;
  btn.disabled = true; btn.textContent = "Releasing...";
  try {
    const { data, error } = await sb.rpc("dashboard_reset_hwid", { p_key: licenseKey, p_password: password });
    if (error) throw error;
    if (!data) { alert("Reset failed. Check the key and password."); return; }
    const data2 = await fetchLicense(licenseKey, password);
    if (data2) {
      const i = licenses.findIndex(l => l.license_key === licenseKey);
      if (i >= 0) licenses[i] = { ...data2, pwd: password };
    }
    renderOrders();
  } catch (err) {
    alert("Failed: " + (err.message || "unknown error"));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Reset HWID"; }
  }
}

function logout() {
  savedKeys = []; licenses = [];
  localStorage.removeItem(LS_KEY);
  document.getElementById("orders-list").innerHTML = "";
  showAuth(false);
}

// Event delegation for dynamically rendered order cards.
document.getElementById("orders-list").addEventListener("click", (e) => {
  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) { copyText(copyBtn.getAttribute("data-copy")); return; }
  const removeBtn = e.target.closest("[data-remove]");
  if (removeBtn) { removeLicense(removeBtn.getAttribute("data-remove")); return; }
  const resetBtn = e.target.closest("[data-reset]");
  if (resetBtn) {
    const key = resetBtn.getAttribute("data-reset");
    const pwd = resetBtn.getAttribute("data-pwd");
    const rowId = resetBtn.id.replace(/^rst-/, "");
    unbindHWID(key, pwd, rowId);
  }
});

document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("auth-close-btn").addEventListener("click", () => { if (licenses.length) closeAuth(); });
document.getElementById("signin-btn").addEventListener("click", attemptAuth);
document.getElementById("input-pwd").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptAuth(); });
document.getElementById("input-key").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptAuth(); });

// Exposed for inline onclick="showAuth(true)" handlers in rendered markup.
window.showAuth = showAuth;
</script>
</body>
</html>
