<!doctype html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Indica — My Licenses</title>
<link rel=preconnect href=https://fonts.googleapis.com>
<link rel=preconnect href=https://fonts.gstatic.com crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;900&family=Lato:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel=stylesheet>
<style>
:root{
  --bg:#09090C;--bg-soft:#121016;--card:#161319;--border:#262230;
  --text:#ECE9F4;--muted:#9A92B3;
  --accent:#8373EB;--accent-2:#9A8DF0;--glow:rgba(131,115,235,.35);
  --green:#4ADE80;--amber:#F59E0B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Lato",system-ui,sans-serif;line-height:1.65;min-height:100vh}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:"Montserrat",sans-serif}
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(9,9,12,.85);border-bottom:1px solid var(--border)}
.topbar-inner{width:min(1080px,92%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Montserrat";font-weight:900;font-size:1.05rem}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 18px var(--glow)}
.topbar-links{display:flex;gap:22px;font-size:.88rem;color:var(--muted)}
.topbar-links a:hover{color:var(--text)}
.topbar-btn{padding:8px 18px;border-radius:9px;font-family:"Montserrat";font-weight:700;font-size:.82rem;border:1px solid var(--border);color:var(--muted);background:none;cursor:pointer;transition:.2s}
.topbar-btn:hover{color:var(--text);border-color:var(--accent)}
.main{width:min(1080px,92%);margin:0 auto;padding:48px 0 90px}
.page-head{margin-bottom:32px}
.page-head h1{font-size:2rem;font-weight:900;letter-spacing:-.02em}
.page-head p{color:var(--muted);font-size:.95rem;margin-top:4px}
.orders{display:flex;flex-direction:column;gap:14px}
.order-card{display:flex;gap:24px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 26px;transition:border-color .2s}
.order-card:hover{border-color:rgba(131,115,235,.45)}
.order-thumb{width:64px;border-radius:10px;flex-shrink:0;background:linear-gradient(160deg,rgba(131,115,235,.25),rgba(131,115,235,.05));border:1px solid rgba(131,115,235,.25);display:flex;align-items:center;justify-content:center;font:800 15px "Montserrat";color:var(--accent-2)}
.order-col{min-width:0}
.order-col.product{flex:1.3}
.order-col.meta{flex:1}
.order-col.links{flex:0 0 150px;display:flex;flex-direction:column}
.order-label{font:600 9px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.order-value{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order-tag{font:600 9px "JetBrains Mono",monospace;padding:2px 8px;border-radius:5px;background:rgba(131,115,235,.12);color:var(--accent-2)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-dot.green{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.5)}
.status-dot.amber{background:#666;box-shadow:0 0 6px rgba(255,255,255,.15)}
.status-text{font-size:12.5px;font-weight:700}
.status-text.green{color:var(--green)}
.status-text.amber{color:#888}
.key-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:6px 12px;max-width:100%}
.key-pill code{font:11.5px "JetBrains Mono",monospace;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key-pill button{color:var(--muted);background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:2px;transition:color .15s}
.key-pill button:hover{color:#fff}
.meta-line{font:11.5px "JetBrains Mono",monospace;color:var(--secondary, #a79fbd);word-break:break-all}
.meta-sub{font-size:12px;color:var(--muted)}
.link-stack{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.link-btn{display:flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:8px;background:rgba(131,115,235,.1);border:1px solid rgba(131,115,235,.2);font-size:11.5px;font-weight:700;color:var(--accent-2);transition:all .15s;cursor:pointer;font-family:"Montserrat"}
.link-btn:hover{background:rgba(131,115,235,.2);border-color:rgba(131,115,235,.4)}
.link-btn:disabled{opacity:.35;cursor:not-allowed}
.link-btn.neutral{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.07);color:var(--muted)}
.link-btn.neutral:hover{color:#fff;background:rgba(255,255,255,.08)}
.add-card{border:1px dashed var(--border);border-radius:16px;padding:36px;text-align:center;color:var(--muted);font-size:.92rem}
.add-card a{color:var(--accent-2);font-weight:700}
/* auth overlay */
.auth-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(7,6,11,.8);backdrop-filter:blur(10px)}
.auth-overlay.hidden{display:none}
.auth-card{width:440px;max-width:92%;padding:42px 38px;border-radius:18px;background:var(--card);border:1px solid var(--border);box-shadow:0 0 60px rgba(131,115,235,.12);position:relative}
.auth-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.auth-close:hover{color:#fff;background:rgba(255,255,255,.06)}
.auth-title{text-align:center;font-family:"Montserrat";font-size:26px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
.auth-title em{font-style:italic;color:var(--accent-2)}
.auth-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:26px}
.error-msg{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.18);color:#fca5a5;padding:10px 14px;border-radius:9px;font-size:11.5px;text-align:center;display:none;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font:600 10px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}
.field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px 15px;color:#fff;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;font-family:"Lato"}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(131,115,235,.15)}
.btn-fill{width:100%;height:46px;border-radius:999px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;font-family:"Montserrat";display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:.2s;box-shadow:0 0 26px var(--glow)}
.btn-fill:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 0 38px var(--glow)}
.btn-fill.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);box-shadow:none}
.btn-fill.ghost:hover{color:#fff;border-color:var(--accent)}
.empty-note{text-align:center;color:var(--muted);font-size:13px;padding:40px}
.empty-note a{color:var(--accent-2);font-weight:700}
@media(max-width:820px){
  .order-card{flex-direction:column;gap:16px}
  .order-col.links{flex:auto}
  .link-stack{flex-direction:row;flex-wrap:wrap}
  .link-btn{flex:1}
  .topbar-links{display:none}
}
</style>
</head>
<body>
<div class=topbar>
  <div class=topbar-inner>
    <a class=brand href=index.html><span class=brand-mark></span> Indica</a>
    <div class=topbar-links>
      <a href=index.html#features>Features</a>
      <a href=index.html#purchase>Purchase</a>
    </div>
    <button class=topbar-btn id=logoutBtn>Sign out</button>
  </div>
</div>

<main class=main>
  <div class=page-head>
    <h1>My licenses</h1>
    <p>Every key saved on this device, with HWID status and time remaining.</p>
  </div>
  <div class=orders id=orders-list></div>
</main>

<div class="auth-overlay hidden" id=auth-overlay>
  <div class="auth-card">
    <button class=auth-close onclick=closeAuth() aria-label=Close>×</button>
    <div class=auth-title>Welcome <em>back</em></div>
    <div class=auth-sub>Enter your license key to open your dashboard</div>
    <div id=login-error class=error-msg></div>
    <div class=field>
      <label for=input-key>License key</label>
      <input type=text id=input-key placeholder=INDICA-XXXX-XXXX autocomplete=off>
    </div>
    <div class=field>
      <label for=input-pwd>Password</label>
      <input type=password id=input-pwd placeholder="••••••••">
    </div>
    <button class=btn-fill onclick=attemptAuth()>Sign in</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const _k = [
  "aHR0cHM6Ly9tYWZhZnZqeGtodGJ5YWNwbnN3YS5zdXBhYmFzZS5jbw==",
  "ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW0xaFptRm1kbXA0YTJoMFlubGhZM0J1YzNkaElpd2ljbTlzWlNJNklt",
  "RnViMjRpTENKcFlYUWlPakUzTnpVNU5UTXpNRFFzSW1WNGNDSTZNakE1TVRVeU9UTXdOSDAudC1TVTM2UTJ1Tm5PT1B2Nk0wVmpTSjZBSF9qaF9ua2tUdEM4Szh2OE9LWQ==",
  "bGljZW5zZV9rZXlz",
  "bGljZW5zZV9rZXk=",
  "cGFzc3dvcmQ=",
  "aXNfYWN0aXZl",
  "ZXhwaXJlc19hdA==",
  "aHdpZA==",
  "aW5kaWNhX3NhdmVkX2tleXM="
];
function _g(i){ return atob(_k[i]); }
const TABLE=_g(3), K_KEY=_g(4), K_PWD=_g(5), K_ACTIVE=_g(6), K_EXP=_g(7), K_HWID=_g(8), LS=_g(9);
const sb = supabase.createClient(_g(0), _g(1)+_g(2));

let savedKeys = [];
let keyData = [];

window.addEventListener("DOMContentLoaded", () => {
  try {
    const stored = localStorage.getItem(LS);
    if (stored) { savedKeys = JSON.parse(stored); if (savedKeys.length > 0) loadAllSavedKeys(); }
  } catch(e){}
  if (savedKeys.length === 0) showAuth();
});

function showAuth(){
  document.getElementById("auth-overlay").classList.remove("hidden");
  document.getElementById("input-key").value = "";
  document.getElementById("input-pwd").value = "";
  document.getElementById("login-error").style.display = "none";
}
function closeAuth(){ document.getElementById("auth-overlay").classList.add("hidden"); }

async function loadAllSavedKeys(){
  if (savedKeys.length === 0){ showAuth(); return; }
  try {
    const { data, error } = await sb.from(TABLE).select("*").in(K_KEY, savedKeys.map(k => k.key));
    if (error) throw error;
    keyData = (data || []).filter(row => {
      const saved = savedKeys.find(sk => sk.key === row[K_KEY]);
      return saved && saved.pwd === row[K_PWD];
    });
    if (keyData.length > 0){ closeAuth(); renderOrders(); }
    else logout();
  } catch(err){ console.error(err); showAuth(); }
}

async function attemptAuth(){
  const errEl = document.getElementById("login-error");
  const licenseKey = document.getElementById("input-key").value.trim();
  const password = document.getElementById("input-pwd").value;
  if (!licenseKey || !password) return;
  try {
    const { data, error } = await sb.from(TABLE).select("*").eq(K_KEY, licenseKey).single();
    if (error || !data) { errEl.innerText = "License key not found."; errEl.style.display = "block"; return; }
    if (data[K_PWD] !== password){ errEl.innerText = "Wrong password for this key."; errEl.style.display = "block"; return; }
    if (!data[K_ACTIVE]){ errEl.innerText = "License has been disabled."; errEl.style.display = "block"; return; }
    if (data[K_EXP] && new Date(data[K_EXP]) < new Date()){ errEl.innerText = "License has expired."; errEl.style.display = "block"; return; }
    if (!savedKeys.some(k => k.key === licenseKey)){
      savedKeys.push({ key: licenseKey, pwd: password });
      localStorage.setItem(LS, JSON.stringify(savedKeys));
    }
    await loadAllSavedKeys();
  } catch(err){
    errEl.innerText = err.message || "Something went wrong. Try again.";
    errEl.style.display = "block";
  }
}

function renderOrders(){
  const container = document.getElementById("orders-list");
  container.innerHTML = "";
  if (!keyData || keyData.length === 0){
    container.innerHTML = '<div class=empty-note>No licenses found. <a href="https://indicacheat.mysellauth.com/products" target=_blank>Buy one here</a> or <a href=# onclick="showAuth();return false;">add an existing key</a>.</div>';
    return;
  }
  const copySvg = '<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  keyData.forEach((key, idx) => {
    const expDate = key[K_EXP] ? new Date(key[K_EXP]) : null;
    const expStr = expDate ? expDate.toLocaleString("en-US", { dateStyle: "short", timeStyle: "short" }) : "Lifetime";
    const timeLeft = getTimeLeft(key[K_EXP]);
    const isActive = key[K_ACTIVE] && (!expDate || expDate > new Date());
    const status = isActive ? "Undetected" : "Disabled";
    const statusColor = isActive ? "green" : "amber";
    const duration = expDate ? getDurationLabel(expDate) : "Lifetime";
    const rowId = key.id || ("key-" + idx);

    const card = document.createElement("div");
    card.className = "order-card";
    card.innerHTML = `
      <div class=order-thumb>in</div>
      <div class="order-col product">
        <div class=order-label>Product</div>
        <div class=order-value>
          <strong>Indica</strong>
          <span class=order-tags>
            <span class=order-tag>${duration}</span>
          </span>
        </div>
        <div style=margin-top:10px;>
          <div class=order-label>Status</div>
          <div class=order-value>
            <span class="status-dot ${statusColor}"></span>
            <span class="status-text ${statusColor}">${status}</span>
          </div>
        </div>
        <div style=margin-top:10px;>
          <div class=order-label>Key</div>
          <div class=key-pill>
            <code>${key[K_KEY]}</code>
            <button onclick="copyText('${key[K_KEY]}')" title="Copy">${copySvg}</button>
          </div>
        </div>
      </div>
      <div class="order-col meta">
        <div class=order-label>HWID</div>
        <div class=meta-line>${key[K_HWID] ? escapeHtml(key[K_HWID]) : "Not bound"}</div>
        <div style=margin-top:10px;>
          <div class=order-label>Date</div>
          <div class=meta-sub>${expStr}</div>
        </div>
        <div style=margin-top:10px;>
          <div class=order-label>Time left</div>
          <div class=meta-sub style="font-weight:700;color:${timeLeft.includes("Expired") ? "#888" : "#fff"};">${timeLeft}</div>
        </div>
        <button onclick="removeLicense('${key[K_KEY]}')" style="margin-top:10px;font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;">Remove</button>
      </div>
      <div class="order-col links">
        <div class=order-label style=margin-bottom:6px;>Links</div>
        <div class=link-stack>
          <a href="https://indicacheat.xyz/indica-loader.exe" target=_blank class=link-btn>Loader</a>
          ${key[K_HWID] ? `<button id="rst-${rowId}" onclick="unbindHWID('${key[K_KEY]}','${key[K_PWD]}','${rowId}')" class=link-btn>Reset HWID</button>`
                        : `<button class=link-btn disabled style="opacity:.3;cursor:not-allowed;">Reset HWID</button>`}
          <a href=https://discord.gg/indica target=_blank class="link-btn neutral">Support</a>
        </div>
      </div>`;
    container.appendChild(card);
  });

  const add = document.createElement("div");
  add.className = "add-card";
  add.innerHTML = `Another key? <a href="#" onclick="showAuth();return false;">Sign in with it</a> — it'll be added to this dashboard.`;
  container.appendChild(add);
}

function getDurationLabel(expDate){
  if (!expDate) return "Lifetime";
  const diffDays = Math.ceil((expDate - new Date()) / 86400000);
  if (diffDays <= 1) return "1 Day";
  if (diffDays <= 7) return "1 Week";
  if (diffDays <= 31) return "1 Month";
  return Math.ceil(diffDays / 30) + " Months";
}
function getTimeLeft(expiryString){
  if (!expiryString) return "Lifetime";
  const diffMs = new Date(expiryString) - new Date();
  if (diffMs <= 0) return "Expired";
  const d = Math.floor(diffMs / 86400000);
  const h = Math.floor((diffMs % 86400000) / 3600000);
  const m = Math.floor((diffMs % 3600000) / 60000);
  let parts = [];
  if (d > 0) parts.push(d + "d");
  if (h > 0) parts.push(h + "h");
  if (m > 0) parts.push(m + "m");
  return parts.join(" ") + " left";
}
function removeLicense(licenseKey){
  savedKeys = savedKeys.filter(k => k.key !== licenseKey);
  keyData = keyData.filter(k => k[K_KEY] !== licenseKey);
  localStorage.setItem(LS, JSON.stringify(savedKeys));
  if (keyData.length > 0) renderOrders(); else logout();
}
function escapeHtml(v){ return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
async function copyText(t){ try { await navigator.clipboard.writeText(t); } catch(e){} }
async function unbindHWID(licenseKey, password, rowId){
  const btn = document.getElementById("rst-" + rowId);
  if (!btn) return;
  btn.disabled = true; btn.innerText = "Releasing...";
  try {
    const { error } = await sb.from(TABLE).update({ [K_HWID]: null }).eq(K_KEY, licenseKey).eq(K_PWD, password);
    if (error) throw error;
    await loadAllSavedKeys();
  } catch(err){ alert("Failed: " + err.message); }
  finally { if (btn){ btn.disabled = false; btn.innerText = "Reset HWID"; } }
}
function logout(){
  savedKeys = []; keyData = [];
  localStorage.removeItem(LS);
  document.getElementById("orders-list").innerHTML = "";
  showAuth();
}
document.getElementById("logoutBtn").addEventListener("click", logout);
</script>
</body>
</html>
