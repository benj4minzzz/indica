<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inertia — Dashboard</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="slides.css">
  <style>
    /* dashboard: a left sidebar + a scrolling order list, like a store account page */
    body { overflow: hidden; }
    .shell { display: flex; height: 100vh; }

    /* ---- sidebar ---- */
    .side {
      width: 240px; flex: 0 0 240px; height: 100vh; display: flex; flex-direction: column;
      background: var(--panel); border-right: 1px solid var(--line); padding: 20px 16px;
    }
    .side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
    .side .brand img { height: 26px; width: auto; }
    .side .brand span { font-family: var(--display); font-weight: 700; font-size: 18px; }
    .side .sect { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-mute); padding: 14px 8px 6px; }
    .side a.nav-item, .side button.nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border-radius: 9px; color: var(--text-dim); text-decoration: none;
      font-size: 14px; font-weight: 500; border: 0; background: transparent; cursor: pointer; text-align: left;
    }
    .side a.nav-item:hover, .side button.nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .side a.nav-item.active { background: var(--accent-soft); color: #c9cbff; }
    .side .nav-item svg { width: 17px; height: 17px; flex: 0 0 17px; }
    .side .spacer { flex: 1; }
    .promo {
      margin: 10px 4px 14px; padding: 16px; border-radius: 12px; color: #fff;
      background: linear-gradient(135deg, #5a5ff0, #7d5cf0);
    }
    .promo b { display: block; font-weight: 700; font-size: 14px; }
    .promo p { font-size: 12px; opacity: .85; margin: 4px 0 10px; }
    .promo a { display: inline-block; background: rgba(255,255,255,.18); color: #fff; text-decoration: none;
               font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 7px; }
    .who { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
    .who .av { width: 32px; height: 32px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line);
               display: grid; place-items: center; color: var(--text-dim); }
    .who .meta { line-height: 1.2; min-width: 0; }
    .who .meta .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .meta .r { font-size: 11px; color: var(--text-mute); }

    /* ---- main ---- */
    .main { flex: 1; height: 100vh; overflow-y: auto; }
    .topbar { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 28px;
              border-bottom: 1px solid var(--line); color: var(--text-dim); font-size: 14px; }
    .topbar svg { width: 17px; height: 17px; }
    .topbar .crumb { color: var(--text); }
    .content { padding: 28px clamp(20px, 3vw, 44px) 48px; }
    .content h1 { font-family: var(--display); font-weight: 700; font-size: 28px; }
    .content .sub { color: var(--text-dim); margin-top: 4px; margin-bottom: 24px; }

    #orders-list { display: grid; gap: 16px; }
    .order {
      display: grid; grid-template-columns: 128px 1.3fr 1fr 230px; gap: 26px; align-items: start;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px;
      animation: pop .5s var(--ease) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .thumb { aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #070708; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .col .k { font-size: 12px; color: var(--text-mute); font-weight: 600; letter-spacing: .04em; }
    .col .v { margin-top: 3px; color: var(--text); }
    .col .v + .k { margin-top: 16px; }
    .prod { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .prod .name { font-family: var(--display); font-weight: 700; font-size: 20px; }
    .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
           background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim); }
    .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.ok { color: #7ee0a0; }
    .status.warn { color: #f0b36a; }
    .status.bad { color: #f08a8a; }
    .keypill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 6px 12px; }
    .keypill code { font: 500 13px "JetBrains Mono", ui-monospace, monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .keypill button { border: 0; background: transparent; color: var(--text-dim); cursor: pointer; display: grid; place-items: center; padding: 4px; border-radius: 6px; }
    .keypill button:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }

    .links .k { margin-bottom: 8px; }
    .links .btn { width: 100%; justify-content: center; margin-bottom: 8px; }
    .links .btn.ghost { background: transparent; color: var(--text-mute); }
    .links .btn.ghost:hover { color: #f08a8a; }

    .pfp { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .pfp .pav { position: relative; width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; overflow: hidden;
                 background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-dim);
                 transition: border-color .15s, box-shadow .15s; }
    .pfp .pav img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pfp .pav .hover { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
                       background: rgba(6,6,6,.62); color: #fff; transition: opacity .15s; }
    .pfp .pav:hover .hover, .pfp .pav.drop .hover { opacity: 1; }
    .pfp .pav[data-pfpdrag] { cursor: pointer; }
    .pfp .pav.drop { border-color: rgba(110,115,251,.9); box-shadow: 0 0 0 3px rgba(110,115,251,.22); }
    .pfp .pact { display: flex; align-items: center; gap: 6px; }
    .pfp .pact .btn { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12.5px;
                      background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--line); }
    .pfp .pact .btn:hover { color: var(--text); border-color: rgba(255,255,255,.14); }
    .pfp .pact .btn.remove { background: transparent; border-color: transparent; }
    .pfp .pact .btn.remove:hover:not([disabled]) { color: #f08a8a; }
    .pick { width: auto; display: inline-flex; cursor: pointer; }
    .savehint { font-size: 12px; color: var(--text-mute); min-height: 0; margin-top: 6px; }
    .savehint:empty { margin-top: 0; }
    .savehint.bad { color: #f08a8a; }

    .note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; color: var(--text-dim); }
    .note a { color: var(--accent); }

    /* sign-in card over a blurred page */
    .overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
      background: rgba(6, 6, 6, 0.72); backdrop-filter: blur(10px); }
    .overlay.hidden { display: none; }
    .auth { position: relative; width: min(400px, 100%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9), 0 0 100px -40px rgba(110,115,251,.5); animation: pop .45s var(--ease) both; }
    .auth h2 { font-family: var(--display); font-weight: 700; font-size: 24px; }
    .auth p { color: var(--text-dim); font-size: 14px; margin: 6px 0 18px; }
    .auth label { display: block; font-size: 12px; font-weight: 600; color: var(--text-mute); letter-spacing: .04em; text-transform: uppercase; margin: 12px 0 6px; }
    .auth input { width: 100%; height: 42px; padding: 0 12px; border-radius: 8px;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font: 500 14px var(--body);
      outline: none; transition: border-color .15s, box-shadow .15s; }
    .auth input:focus { border-color: rgba(110,115,251,.6); box-shadow: 0 0 0 3px rgba(110,115,251,.15); }
    .auth .btn.primary { width: 100%; margin-top: 20px; height: 42px; }
    .auth .close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 8px;
      border: 0; background: transparent; color: var(--text-dim); font-size: 20px; cursor: pointer; }
    .auth .close:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .auth .close:disabled { display: none; }
    .err { display: none; margin-top: 12px; color: #f08a8a; font-size: 13px; }

    @media (max-width: 920px) {
      .side { display: none; }
      .order { grid-template-columns: 96px 1fr; }
      .order .col.mid, .order .links { grid-column: 1 / -1; }
      .links .btn { width: auto; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand"><img src="logo.png" alt="inertia"><span>inertia</span></div>

    <div class="sect">Menu</div>
    <a class="nav-item active" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Licenses
    </a>
    <a class="nav-item" href="index.html#pricing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Store
    </a>

    <div class="sect">Links</div>
    <a class="nav-item" href="https://discord.gg/2WXNQyR8nq" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4.3A19 19 0 0 0 15.2 3l-.3.5a14 14 0 0 1 4 1.9 13 13 0 0 0-10-0 14 14 0 0 1 4-1.9L12.6 3A19 19 0 0 0 4 4.3C1.5 8 1 11.6 1.2 15.2A19 19 0 0 0 7 18l.6-1a12 12 0 0 1-2-1l.5-.3a13 13 0 0 0 11 0l.5.3a12 12 0 0 1-2 1L17 18a19 19 0 0 0 5.8-2.8c.3-4.2-.5-7.7-2.8-10.9ZM8.4 13.2c-.9 0-1.6-.9-1.6-1.9s.7-1.9 1.6-1.9 1.6.9 1.6 1.9-.7 1.9-1.6 1.9Zm7.2 0c-.9 0-1.6-.9-1.6-1.9s.7-1.9 1.6-1.9 1.6.9 1.6 1.9-.7 1.9-1.6 1.9Z"/></svg>
      Discord
    </a>
    <a class="nav-item" href="https://discord.gg/2WXNQyR8nq" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      Support
    </a>

    <div class="spacer"></div>

    <div class="promo">
      <b>Need more time?</b>
      <p>Top up any key from the store.</p>
      <a href="index.html#pricing">Open store</a>
    </div>
    <div class="who">
      <div class="av"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
      <div class="meta"><div class="n" id="who-name">Member</div><div class="r" id="who-sub">Signed in</div></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/></svg>
      <span>/</span><span class="crumb">Licenses</span>
      <span style="flex:1"></span>
      <button class="btn" id="logoutBtn" type="button">Log out</button>
    </div>
    <div class="content">
      <h1>Your licenses</h1>
      <div class="sub">Every key on this account, how long it has left, and HWID resets.</div>
      <div id="orders-list"></div>
    </div>
  </main>
</div>

<div class="overlay hidden" id="auth-overlay">
  <div class="auth">
    <button class="close" id="auth-close-btn" type="button" aria-label="Close">&times;</button>
    <h2>Sign in</h2>
    <p>Use the license key and password you got with your purchase.</p>
    <label for="input-key">License key</label>
    <input id="input-key" autocomplete="username" spellcheck="false">
    <label for="input-pwd">Password</label>
    <input id="input-pwd" type="password" autocomplete="current-password">
    <button class="btn primary" id="signin-btn" type="button">Sign in</button>
    <div class="err" id="login-error"></div>
  </div>
</div>

<script>
"use strict";
// Same Supabase project as before. The anon key is public by design: both
// RPCs check the key + password on the server (see supabase-dashboard.sql)
// and never hand the password column to the browser.
const SUPABASE_URL = "https://mafafvjxkhtbyacpnswa.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hZmFmdmp4a2h0YnlhY3Buc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NTMzMDQsImV4cCI6MjA5MTUyOTMwNH0.t-SU36Q2uNnOOPv6M0VjSJ6AH_jh_nkkTtC8K8v8OKY";
// Kept the same name as the old site so keys people already saved still load.
const LS_KEY = "indica_saved_keys";
const DISCORD = "https://discord.gg/2WXNQyR8nq";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let savedKeys = [];  // [{ key, pwd }]
let licenses = [];   // [{ license_key, pwd, is_active, expires_at, duration_days, hwid_bound, hwid_hint }]

window.addEventListener("DOMContentLoaded", () => {
  try {
    const stored = localStorage.getItem(LS_KEY);
    if (stored) savedKeys = JSON.parse(stored) || [];
  } catch (e) { savedKeys = []; }
  if (savedKeys.length) loadAllSavedKeys(); else showAuth(false);
});

function showAuth(closable) {
  document.getElementById("auth-overlay").classList.remove("hidden");
  document.getElementById("auth-close-btn").disabled = !closable;
  document.getElementById("input-key").value = "";
  document.getElementById("input-pwd").value = "";
  document.getElementById("login-error").style.display = "none";
  setTimeout(() => document.getElementById("input-key").focus(), 0);
}
function closeAuth() { document.getElementById("auth-overlay").classList.add("hidden"); }

async function fetchLicense(key, pwd) {
  const { data, error } = await sb.rpc("dashboard_license", { p_key: key, p_password: pwd });
  if (error) throw error;
  return data; // null when the key/password pair doesn't match
}

async function loadAllSavedKeys() {
  if (!savedKeys.length) { showAuth(false); return; }
  try {
    const results = await Promise.all(savedKeys.map(async (sk) => {
      try {
        const data = await fetchLicense(sk.key, sk.pwd);
        return data ? { ...data, pwd: sk.pwd } : null;
      } catch (e) { return null; }
    }));
    licenses = results.filter(Boolean);
    if (licenses.length) { persistSavedKeys(); closeAuth(); renderOrders(); }
    else logout();
  } catch (err) {
    console.error(err);
    showAuth(savedKeys.length > 0);
  }
}

function persistSavedKeys() {
  savedKeys = licenses.map(l => ({ key: l.license_key, pwd: l.pwd }));
  try { localStorage.setItem(LS_KEY, JSON.stringify(savedKeys)); } catch (e) {}
}

async function attemptAuth() {
  const errEl = document.getElementById("login-error");
  const btn = document.getElementById("signin-btn");
  const licenseKey = document.getElementById("input-key").value.trim();
  const password = document.getElementById("input-pwd").value;
  errEl.style.display = "none";
  if (!licenseKey || !password) return;
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    const data = await fetchLicense(licenseKey, password);
    if (!data) {
      errEl.textContent = "Wrong license key or password.";
      errEl.style.display = "block";
      return;
    }
    if (!licenses.some(l => l.license_key === data.license_key)) licenses.push({ ...data, pwd: password });
    persistSavedKeys();
    closeAuth();
    renderOrders();
  } catch (err) {
    errEl.textContent = err.message || "Something went wrong. Try again.";
    errEl.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

function renderOrders() {
  const container = document.getElementById("orders-list");
  container.innerHTML = "";

  const who = document.getElementById("who-sub");
  if (who) who.textContent = licenses.length ? (licenses.length + (licenses.length === 1 ? " license" : " licenses")) : "Signed in";

  if (!licenses.length) {
    container.innerHTML = '<div class="note">No licenses yet. <a href="index.html#pricing">Get one</a> or <a href="#" onclick="showAuth(true);return false;">add an existing key</a>.</div>';
    return;
  }
  const copySvg = '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  licenses.forEach((lic, idx) => {
    const expDate = lic.expires_at ? new Date(lic.expires_at) : null;
    const expStr = expDate ? expDate.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) : "Never";
    const isExpired = expDate && expDate <= new Date();
    const isActive = lic.is_active && !isExpired;
    const status = !lic.is_active ? "Disabled" : isExpired ? "Expired" : "Active";
    const statusClass = isActive ? "ok" : (!lic.is_active || isExpired ? "bad" : "warn");
    const duration = lic.duration_days ? getDurationLabel(lic.duration_days) : "Lifetime";
    const rowId = "key-" + idx;
    const defaultAvSvg = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
    const uploadSvg = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>';

    const card = document.createElement("div");
    card.className = "order";
    card.innerHTML = `
      <div class="thumb"><img src="box.png" alt="inertia for Rainbow Six Siege"></div>
      <div class="col">
        <div class="prod"><span class="name">inertia</span><span class="tag">R6S</span><span class="tag">${escapeHtml(duration)}</span></div>
        <div class="k" style="margin-top:14px">Status</div>
        <div class="v"><span class="status ${statusClass}">${status}</span></div>
        <div class="k">Picture</div>
        <div class="v pfp">
          <span class="pav" title="Click or drop a picture" data-pfpdrag="${escapeHtml(lic.license_key)}">${lic.pfp ? `<img src="${escapeHtml(lic.pfp)}" alt="">` : defaultAvSvg}<span class="hover">${uploadSvg}</span></span>
          <div class="pact">
            <label class="btn pick">Upload<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-pfp="${escapeHtml(lic.license_key)}"></label>
            <button class="btn remove" data-pfpclear="${escapeHtml(lic.license_key)}"${lic.pfp ? "" : " disabled"}>Remove</button>
          </div>
        </div>
        <div class="savehint" data-savehint="${escapeHtml(lic.license_key)}"></div>
        <div class="k">Key</div>
        <div class="v"><span class="keypill"><code>${escapeHtml(lic.license_key)}</code><button data-copy="${escapeHtml(lic.license_key)}" title="Copy key">${copySvg}</button></span></div>
      </div>
      <div class="col mid">
        <div class="k">Time left</div>
        <div class="v"><strong>${getTimeLeft(lic.expires_at)}</strong></div>
        <div class="k">Expires</div>
        <div class="v">${expStr}</div>
        <div class="k">HWID</div>
        <div class="v">${lic.hwid_bound ? escapeHtml(lic.hwid_hint || "Bound") : "Not bound"}</div>
      </div>
      <div class="links">
        <div class="k">Links</div>
        <a class="btn soft" href="https://inertiascript.mysellauth.com/product/inertia-monthly" target="_blank" rel="noopener">Buy more time</a>
        ${lic.hwid_bound
          ? `<button class="btn" id="rst-${rowId}" data-reset="${escapeHtml(lic.license_key)}" data-pwd="${escapeHtml(lic.pwd)}">Reset HWID</button>`
          : `<button class="btn" disabled>Reset HWID</button>`}
        <a class="btn" href="${DISCORD}" target="_blank" rel="noopener">Support</a>
        <button class="btn ghost" data-remove="${escapeHtml(lic.license_key)}">Remove key</button>
      </div>`;
    container.appendChild(card);
  });
}

// ---- profile picture, saved to the license row ----
// The picture is read here, shrunk to 96x96 and re-encoded as PNG so the data:
// URL stays small (the app embeds it in its menu and reloads it on login).
async function fileToProfilePng(file) {
  const bmp = await createImageBitmap(file);
  const n = Math.min(bmp.width, bmp.height);
  const sx = (bmp.width - n) / 2, sy = (bmp.height - n) / 2;
  const c = document.createElement("canvas");
  c.width = c.height = 96;
  c.getContext("2d").drawImage(bmp, sx, sy, n, n, 0, 0, 96, 96);
  return c.toDataURL("image/png");
}

function findLicense(licenseKey) { return licenses.find(l => l.license_key === licenseKey); }

function setHint(licenseKey, text, bad) {
  const hint = document.querySelector(`[data-savehint="${CSS.escape(licenseKey)}"]`);
  if (!hint) return;
  hint.textContent = text;
  hint.classList.toggle("bad", !!bad);
}

async function saveProfile(licenseKey, pfp) {
  const lic = findLicense(licenseKey);
  if (!lic) return;
  const nextPfp = pfp === undefined ? (lic.pfp || null) : pfp;
  setHint(licenseKey, "Saving...", false);
  try {
    // The name is sent back unchanged: the RPC replaces both columns, so an
    // existing display name must not be wiped by a picture change.
    const { data, error } = await sb.rpc("dashboard_save_profile", {
      p_key: licenseKey, p_password: lic.pwd,
      p_name: lic.name || null,
      p_pfp: nextPfp,
    });
    if (error) throw error;
    if (!data) throw new Error("Key or password rejected. Sign in again.");
    lic.pfp = nextPfp;
    renderOrders();
    setHint(licenseKey, "Saved.", false);
  } catch (err) {
    setHint(licenseKey, "Failed: " + (err.message || "unknown error"), true);
  }
}

function getDurationLabel(days) {
  if (!days) return "Lifetime";
  if (days <= 1) return "1 Day";
  if (days <= 7) return "1 Week";
  if (days <= 31) return "1 Month";
  return Math.ceil(days / 30) + " Months";
}
function getTimeLeft(expiryString) {
  if (!expiryString) return "Lifetime";
  const diffMs = new Date(expiryString) - new Date();
  if (diffMs <= 0) return "Expired";
  const d = Math.floor(diffMs / 86400000);
  const h = Math.floor((diffMs % 86400000) / 3600000);
  const m = Math.floor((diffMs % 3600000) / 60000);
  const parts = [];
  if (d > 0) parts.push(d + "d");
  if (h > 0) parts.push(h + "h");
  if (m > 0) parts.push(m + "m");
  return (parts.join(" ") || "0m") + " left";
}
function escapeHtml(v) { return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); } catch (e) {} }

function removeLicense(licenseKey) {
  licenses = licenses.filter(l => l.license_key !== licenseKey);
  persistSavedKeys();
  if (licenses.length) renderOrders(); else logout();
}

async function unbindHWID(licenseKey, password, rowId) {
  const btn = document.getElementById("rst-" + rowId);
  if (!btn) return;
  btn.disabled = true; btn.textContent = "Releasing...";
  try {
    const { data, error } = await sb.rpc("dashboard_reset_hwid", { p_key: licenseKey, p_password: password });
    if (error) throw error;
    if (!data) { alert("Reset failed. Check the key and password."); return; }
    const fresh = await fetchLicense(licenseKey, password);
    if (fresh) {
      const i = licenses.findIndex(l => l.license_key === licenseKey);
      if (i >= 0) licenses[i] = { ...fresh, pwd: password };
    }
    renderOrders();
  } catch (err) {
    alert("Failed: " + (err.message || "unknown error"));
  } finally {
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = "Reset HWID"; }
  }
}

function logout() {
  savedKeys = []; licenses = [];
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  document.getElementById("orders-list").innerHTML = "";
  showAuth(false);
}

document.getElementById("orders-list").addEventListener("click", (e) => {
  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) { copyText(copyBtn.getAttribute("data-copy")); return; }
  const removeBtn = e.target.closest("[data-remove]");
  if (removeBtn) { removeLicense(removeBtn.getAttribute("data-remove")); return; }
  const clearBtn = e.target.closest("[data-pfpclear]");
  if (clearBtn) { saveProfile(clearBtn.getAttribute("data-pfpclear"), null); return; }
  const resetBtn = e.target.closest("[data-reset]");
  if (resetBtn) unbindHWID(resetBtn.getAttribute("data-reset"), resetBtn.getAttribute("data-pwd"), resetBtn.id.replace(/^rst-/, ""));
});
// The file picker is re-rendered with the list, so listen on the list.
document.getElementById("orders-list").addEventListener("change", async (e) => {
  const fileInput = e.target.closest("input[data-pfp]");
  if (fileInput && fileInput.files && fileInput.files[0]) {
    try {
      const dataUrl = await fileToProfilePng(fileInput.files[0]);
      await saveProfile(fileInput.getAttribute("data-pfp"), dataUrl);
    } catch (err) {
      alert("Could not read that image: " + (err.message || "unknown error"));
    }
    fileInput.value = "";
  }
});

// Clicking the avatar opens the same picker as the Upload button.
document.getElementById("orders-list").addEventListener("click", (e) => {
  const av = e.target.closest("[data-pfpdrag]");
  if (!av) return;
  const input = av.parentElement.querySelector("input[data-pfp]");
  if (input) input.click();
});

// Dropping a picture on the avatar sets it too.
document.getElementById("orders-list").addEventListener("dragover", (e) => {
  if (e.target.closest("[data-pfpdrag]")) { e.preventDefault(); e.target.closest("[data-pfpdrag]").classList.add("drop"); }
});
document.getElementById("orders-list").addEventListener("dragleave", (e) => {
  const av = e.target.closest("[data-pfpdrag]"); if (av) av.classList.remove("drop");
});
document.getElementById("orders-list").addEventListener("drop", async (e) => {
  const av = e.target.closest("[data-pfpdrag]"); if (!av) return;
  e.preventDefault(); av.classList.remove("drop");
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file) return;
  try {
    await saveProfile(av.getAttribute("data-pfpdrag"), await fileToProfilePng(file));
  } catch (err) {
    alert("Could not read that image: " + (err.message || "unknown error"));
  }
});

document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("auth-close-btn").addEventListener("click", () => { if (licenses.length) closeAuth(); });
document.getElementById("signin-btn").addEventListener("click", attemptAuth);
document.getElementById("input-pwd").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptAuth(); });
document.getElementById("input-key").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptAuth(); });
window.showAuth = showAuth;
</script>
