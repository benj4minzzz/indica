<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>indica — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: #09090b;
            --surface-raised: #0e0e11;
            --border: rgba(255,255,255,0.06);
            --border-glow: rgba(219,39,119,0.12);
            --accent: #DB2777;
            --accent-hover: #EC4899;
            --accent-strong: #BE185D;
            --accent-glow: rgba(219,39,119,0.15);
            --text: #fafafa;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --green: #34d399;
            --red: #f87171;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            letter-spacing: -0.01em;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font: inherit; border: none; outline: none; background: none; color: inherit; }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            background: rgba(3,3,3,0.72);
        }
        .navbar-inner {
            max-width: 1200px; margin: 0 auto;
            height: 60px; padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.03em; }
        .brand span { color: var(--accent); }
        .nav-links { display: flex; align-items: center; gap: 36px; }
        .nav-links a { font-size: 13px; font-weight: 500; color: var(--text-tertiary); transition: color 0.2s; }
        .nav-links a:hover { color: #fff; }
        .nav-links a.on { color: #fff; }
        .sign-out { font-size: 12px; font-weight: 600; color: var(--text-tertiary); transition: color 0.2s; }
        .sign-out:hover { color: var(--red); }

        .shell { max-width: 480px; margin: 0 auto; padding: 0 24px; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
        }
        .centered {
            min-height: calc(100vh - 60px);
            display: flex; flex-direction: column; justify-content: center;
        }

        .login-logo {
            width: 48px; height: 48px; margin: 0 auto 20px;
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #fff; font-family: 'Fira Code', monospace; font-weight: 800; font-size: 18px;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .login-title { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.03em; }
        .login-sub { text-align: center; color: var(--text-tertiary); font-size: 13px; margin-bottom: 28px; }
        .error-banner {
            background: rgba(248,113,113,0.06);
            border: 1px solid rgba(248,113,113,0.15);
            color: #fca5a5;
            padding: 10px 14px; border-radius: var(--radius-sm);
            font-size: 12px; text-align: center;
            display: none; margin-bottom: 16px;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-tertiary); margin-bottom: 8px;
            font-family: 'Fira Code', monospace;
        }
        .field input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 13px 14px;
            color: #fff; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(219,39,119,0.1);
        }
        .btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 44px; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 700; font-family: inherit;
            cursor: pointer; border: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 0 24px var(--accent-glow); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border); color: var(--text-secondary); font-weight: 600;
        }
        .btn-outline:hover { border-color: rgba(255,255,255,0.15); color: #fff; }
        .btn-danger { color: var(--red); border-color: rgba(248,113,113,0.15); }
        .btn-danger:hover { border-color: rgba(248,113,113,0.35); }

        .status-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .status-name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
        .status-pill {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 11px; font-weight: 700; font-family: 'Fira Code', monospace;
            color: var(--green);
            border: 1px solid rgba(52,211,153,0.2);
            background: rgba(52,211,153,0.06);
            padding: 5px 11px; border-radius: 999px;
        }
        .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(52,211,153,0.3); }
        .key-box {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 13px 14px; margin-bottom: 24px;
        }
        .key-box code { flex: 1; font-size: 12px; color: #fff; font-family: 'Fira Code', monospace; word-break: break-all; }
        .copy-btn {
            background: none; border: none; cursor: pointer;
            color: var(--text-tertiary); padding: 4px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.2s;
        }
        .copy-btn:hover { color: #fff; }
        .meta { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
        .meta-row { display: flex; justify-content: space-between; align-items: center; }
        .meta-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; font-family: 'Fira Code', monospace; }
        .meta-value { font-size: 13px; color: #fff; font-weight: 600; text-align: right; }
        .meta-value.green { color: var(--green); }
        .meta-value.red { color: var(--red); }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="brand">indica<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="https://discord.gg/2WXNQyR8nq" target="_blank" rel="noopener">Store</a>
                <a href="dashboard.html" class="on">Dashboard</a>
                <a href="https://discord.gg/2WXNQyR8nq" target="_blank">Discord</a>
                <button id="nav-signout" class="sign-out hidden" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </nav>

    <div class="shell centered">
        <div id="login-container" class="panel">
            <div class="login-logo">in</div>
            <div class="login-title">Authenticate</div>
            <div class="login-sub">Enter your license key to access the dashboard</div>
            <div id="login-error" class="error-banner"></div>
            <div class="field">
                <label for="input-license">License Key</label>
                <input type="text" id="input-license" placeholder="INDICA-XXXX-XXXX">
            </div>
            <div class="field">
                <label for="input-password">Password</label>
                <input type="password" id="input-password" placeholder="••••••••">
            </div>
            <button onclick="attemptAuth()" class="btn btn-primary">Sign In</button>
        </div>

        <div id="dashboard-container" class="hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _k = [
            "aHR0cHM6Ly9tYWZhZnZqeGtodGJ5YWNwbnN3YS5zdXBhYmFzZS5jbw==",
            "ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW0xaFptRm1kbXA0YTJoMFlubGhZM0J1YzNkaElpd2ljbTlzWlNJNklt",
            "RnViMjRpTENKcFlYUWlPakUzTnpVNU5UTXpNRFFzSW1WNGNDSTZNakE1TVRVeU9UTXdOSDAudC1TVTM2UTJ1Tm5PT1B2Nk0wVmpTSjZBSF9qaF9ua2tUdEM4Szh2OE9LWQ==",
            "bGljZW5zZV9rZXlz",
            "bGljZW5zZV9rZXk=",
            "cGFzc3dvcmQ=",
            "aXNfYWN0aXZl",
            "ZXhwaXJlc19hdA==",
            "aHdpZA==",
            "aW5kaWNhX3NhdmVkX2tleXM="
        ];
        function _g(i) { return atob(_k[i]); }

        let savedKeys = [];
        let authenticatedKeyData = [];

        window.addEventListener("DOMContentLoaded", () => {
            try {
                const stored = localStorage.getItem(_g(9));
                if (stored) {
                    savedKeys = JSON.parse(stored);
                    if (savedKeys.length > 0) loadAllSavedKeys();
                }
            } catch (e) { console.error(e); }
        });

        async function loadAllSavedKeys() {
            if (savedKeys.length === 0) return;
            const keysList = savedKeys.map(k => k.key);
            try {
                const supabaseClient = supabase.createClient(_g(0), _g(1) + _g(2));
                const { data, error } = await supabaseClient.from(_g(3)).select('*').in(_g(4), keysList);
                if (error) throw error;
                authenticatedKeyData = (data || []).filter(row => {
                    const saved = savedKeys.find(sk => sk.key === row[_g(4)]);
                    return saved && saved.pwd === row[_g(5)];
                });
                if (authenticatedKeyData.length > 0) {
                    populateDashboard();
                    document.getElementById("login-container").classList.add("hidden");
                    document.getElementById("dashboard-container").classList.remove("hidden");
                    document.getElementById("nav-signout").classList.remove("hidden");
                } else { logout(); }
            } catch (err) { console.error(err); }
        }

        async function attemptAuth() {
            const licenseKey = document.getElementById("input-license").value.trim();
            const password = document.getElementById("input-password").value.trim();
            const errorEl = document.getElementById("login-error");
            errorEl.style.display = "none";
            if (!licenseKey || !password) {
                errorEl.innerText = "Please fill in both fields.";
                errorEl.style.display = "block"; return;
            }
            try {
                const supabaseClient = supabase.createClient(_g(0), _g(1) + _g(2));
                const { data, error } = await supabaseClient.from(_g(3)).select('*').eq(_g(4), licenseKey).eq(_g(5), password).single();
                if (error || !data) throw new Error("Invalid credentials");
                if (!data[_g(6)]) { errorEl.innerText = "License has been disabled."; errorEl.style.display = "block"; return; }
                if (data[_g(7)] && new Date(data[_g(7)]) < new Date()) { errorEl.innerText = "License has expired."; errorEl.style.display = "block"; return; }
                if (!savedKeys.some(k => k.key === licenseKey)) {
                    savedKeys.push({ key: licenseKey, pwd: password });
                    localStorage.setItem(_g(9), JSON.stringify(savedKeys));
                }
                await loadAllSavedKeys();
            } catch (err) { console.error(err); errorEl.innerText = "Invalid license key or password."; errorEl.style.display = "block"; }
        }

        function populateDashboard() {
            const container = document.getElementById("dashboard-container");
            container.innerHTML = "";
            if (!authenticatedKeyData || authenticatedKeyData.length === 0) {
                container.innerHTML = `<div class="panel" style="text-align:center;color:var(--text-tertiary);font-size:13px;">No active licenses.</div>`;
                return;
            }
            document.getElementById("nav-signout").classList.remove("hidden");
            authenticatedKeyData.forEach(key => {
                const expDateStr = key[_g(7)] ? new Date(key[_g(7)]).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : "Lifetime";
                const durationBadge = key[_g(7)] ? "Subscription" : "Lifetime";
                const timeLeft = getTimeLeft(key[_g(7)]);
                const copyIcon = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
                const panel = document.createElement("div");
                panel.className = "panel";
                panel.innerHTML = `
                    <div class="status-row">
                        <span class="status-name">indica</span>
                        <span class="status-pill"><span class="dot"></span> Active</span>
                    </div>
                    <div class="key-box">
                        <code>${key[_g(4)]}</code>
                        <button class="copy-btn" onclick="copyToClipboard('${key[_g(4)]}')" title="Copy Key">${copyIcon}</button>
                    </div>
                    <div class="meta">
                        <div class="meta-row"><span class="meta-label">Product</span><span class="meta-value">indica</span></div>
                        <div class="meta-row"><span class="meta-label">Plan</span><span class="meta-value">${durationBadge}</span></div>
                        <div class="meta-row"><span class="meta-label">Expires</span><span class="meta-value">${expDateStr}</span></div>
                        <div class="meta-row"><span class="meta-label">Time Left</span><span class="meta-value ${timeLeft.includes('Expired') ? 'red' : 'green'}">${timeLeft}</span></div>
                    </div>
                    <div class="actions">
                        <a href="https://drive.google.com/file/d/1yfH5y0jSU1GV3RbJe6mUes-Exybw0HQS/view?usp=sharing" target="_blank" class="btn btn-primary">Download Loader</a>
                        ${key[_g(8)] ? `<button id="reset-btn-${key.id}" onclick="unbindHWID('${key[_g(4)]}', '${key[_g(5)]}', ${key.id})" class="btn btn-outline btn-danger">Reset HWID</button>` : `<button class="btn btn-outline" disabled style="opacity:0.3;cursor:not-allowed;">Reset HWID</button>`}
                    </div>
                `;
                container.appendChild(panel);
            });
        }

        function getTimeLeft(expiryString) {
            if (!expiryString) return "Lifetime";
            const expiry = new Date(expiryString);
            const now = new Date();
            const diffMs = expiry - now;
            if (diffMs <= 0) return "Expired";
            const diffDays = Math.floor(diffMs / 86400000);
            const diffHours = Math.floor((diffMs % 86400000) / 3600000);
            const diffMins = Math.floor((diffMs % 3600000) / 60000);
            let parts = [];
            if (diffDays > 0) parts.push(`${diffDays}d`);
            if (diffHours > 0) parts.push(`${diffHours}h`);
            if (diffMins > 0) parts.push(`${diffMins}m`);
            return parts.join(" ") + " left";
        }

        async function unbindHWID(licenseKey, password, rowId) {
            const btn = document.getElementById(`reset-btn-${rowId}`);
            if (!btn) return;
            btn.disabled = true; btn.innerText = "Releasing...";
            try {
                const supabaseClient = supabase.createClient(_g(0), _g(1) + _g(2));
                const { error } = await supabaseClient.from(_g(3)).update({ [_g(8)]: null }).eq(_g(4), licenseKey).eq(_g(5), password);
                if (error) throw error;
                await loadAllSavedKeys();
            } catch (err) { console.error(err); alert("Failed: " + err.message); }
            finally { if (btn) { btn.disabled = false; btn.innerText = "Reset HWID"; } }
        }

        async function copyToClipboard(text) { try { await navigator.clipboard.writeText(text); } catch (err) { console.error(err); } }
        function logout() {
            savedKeys = []; authenticatedKeyData = [];
            localStorage.removeItem(_g(9));
            document.getElementById("input-license").value = "";
            document.getElementById("input-password").value = "";
            document.getElementById("dashboard-container").classList.add("hidden");
            document.getElementById("nav-signout").classList.add("hidden");
            document.getElementById("login-container").classList.remove("hidden");
        }
    </script>
</body>
</html>
