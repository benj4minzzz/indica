<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" font-family="'Unbounded','Arial Black',Arial,sans-serif">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#6e73fb" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#6e73fb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- box front -->
  <rect x="0" y="0" width="480" height="640" fill="url(#box)"/>
  <rect x="0" y="0" width="480" height="640" fill="url(#glow)"/>
  <rect x="10" y="10" width="460" height="620" fill="none" stroke="#ffffff" stroke-opacity="0.08" rx="4"/>

  <!-- wordmark -->
  <text x="42" y="120" fill="#ececf1" font-size="62" font-weight="800" letter-spacing="-3">inertia</text>
  <circle cx="412" cy="100" r="7" fill="#6e73fb"/>

  <!-- licensed by -->
  <text x="42" y="186" fill="#a3a3ad" font-size="20" font-weight="600" letter-spacing="1">Licensed by</text>
  <g transform="translate(42,206)">
    <circle cx="13" cy="13" r="13" fill="#6e73fb" fill-opacity="0.16" stroke="#6e73fb" stroke-opacity="0.5"/>
    <circle cx="13" cy="13" r="5" fill="none" stroke="#6e73fb" stroke-width="2.4"/>
    <text x="36" y="19" fill="#ececf1" font-size="18" font-weight="700">inertia.gg</text>
  </g>

  <!-- product line -->
  <text x="42" y="430" fill="#ececf1" font-size="30" font-weight="800">Product</text>
  <text x="42" y="466" fill="#ececf1" font-size="30" font-weight="800">for</text>
  <text x="42" y="516" fill="#6e73fb" font-size="30" font-weight="800">Rainbow Six</text>
  <text x="42" y="552" fill="#6e73fb" font-size="30" font-weight="800">Siege</text>

  <!-- big vertical game badge on the right -->
  <g transform="translate(372,470) rotate(-90)" fill="none" stroke="#2c2c33" stroke-width="2">
    <text x="0" y="0" fill="#20202a" stroke="none" font-size="86" font-weight="800" letter-spacing="-2">SIEGE</text>
  </g>
  <g transform="translate(360,250)">
    <path d="M44 0 L88 20 V58 C88 96 66 120 44 134 C22 120 0 96 0 58 V20 Z"
          fill="none" stroke="#6e73fb" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M44 34 L62 44 V64 C62 82 54 92 44 98 C34 92 26 82 26 64 V44 Z"
          fill="none" stroke="#6e73fb" stroke-opacity="0.9" stroke-width="3"/>
  </g>

  <!-- footer -->
  <text x="42" y="604" fill="#53535b" font-size="13" font-weight="600">© inertia</text>
</svg>
